# Google Cloud Build Pipeline for Continuous Deployment to Cloud Run
steps:
  # 1. Build Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/skinwatch-app:$COMMIT_SHA', '.']

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/skinwatch-app:$COMMIT_SHA']

  # 3. Deploy Container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skinwatch-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/skinwatch-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/skinwatch-app:$COMMIT_SHA'
